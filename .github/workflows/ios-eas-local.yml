name: iOS build (EAS local on a GitHub runner)

# WHY THIS EXISTS, ALONGSIDE ios-release.yml
#
# `ios-release.yml` signs the app by hand: it needs the distribution
# certificate and an App Store Connect API key as five GitHub secrets. That
# works, but it means lifting credentials out of EAS — where they already live
# and are already managed — and re-entering them somewhere else.
#
# `eas build --local` runs the SAME build EAS would run, on this runner instead
# of theirs. Expo's own servers still hold and hand over the signing
# credentials, so the only secret here is an Expo access token.
#
# Two things are unverified and this workflow exists to settle them, because
# neither is stated in Expo's documentation:
#
#   1. Whether a --local build consumes the account's monthly EAS build quota.
#      It should not — the quota pays for Expo's build workers and this uses
#      none of them — but "should not" is not evidence.
#   2. Whether --local fetches iOS signing credentials from EAS
#      non-interactively, or demands a local credentials.json.
#
# If both come out right, this replaces ios-release.yml and its five secrets
# with one. If either does not, ios-release.yml is already written and works.

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "eas.json build profile"
        type: string
        default: production
      submit:
        description: "Upload to App Store Connect when the build succeeds"
        type: boolean
        default: false

concurrency:
  group: ios-eas-local
  cancel-in-progress: false

jobs:
  build:
    # Apple tooling only exists on macOS runners. Public repositories get these
    # free, which is the entire reason this path is worth trying.
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: expo/package-lock.json

      - name: Install JS dependencies
        working-directory: expo
        run: npm ci

      - name: Report the toolchain
        run: |
          echo "Xcode:     $(xcodebuild -version | head -1)"
          echo "fastlane:  $(fastlane --version 2>/dev/null | grep -i 'fastlane [0-9]' || echo 'not found')"
          echo "CocoaPods: $(pod --version 2>/dev/null || echo 'not found')"
          # `eas build --local` shells out to fastlane and CocoaPods. They ship
          # on the macOS runner image, but say so out loud — a missing one fails
          # deep inside the build with a much worse error message.

      - name: Build with EAS, locally
        working-directory: expo
        env:
          # The only secret. Create it at expo.dev -> account settings ->
          # Access tokens, then add it as EXPO_TOKEN in this repo's Actions
          # secrets. It authenticates the CLI so it can pull down the signing
          # credentials Expo already holds for this project.
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo "EXPO_TOKEN is not set. Create it at expo.dev -> Access tokens"
            echo "and add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/out"
          npx --yes eas-cli@latest build \
            --platform ios \
            --profile "${{ inputs.profile }}" \
            --local \
            --non-interactive \
            --output "$RUNNER_TEMP/out/tee.ipa"

      - name: Confirm the watch app is inside the .ipa
        run: |
          set -euo pipefail
          # The failure this catches is silent: if the watch target is not
          # embedded, the .ipa builds and uploads cleanly and the watch simply
          # never appears in TestFlight, with no error anywhere to explain it.
          WORK="$RUNNER_TEMP/ipacheck"
          rm -rf "$WORK" && mkdir -p "$WORK"
          unzip -q "$RUNNER_TEMP/out/tee.ipa" -d "$WORK"
          APP=$(find "$WORK/Payload" -maxdepth 1 -name '*.app' | head -1)
          echo "App bundle: $APP"
          if [ -d "$APP/Watch" ]; then
            find "$APP/Watch" -maxdepth 2 -name '*.app' -print
            echo "OK: a watch app is embedded"
          else
            echo "FAIL: no Watch directory in the .ipa — the watch app is not embedded"
            exit 1
          fi

          # Both bundles must carry the same CFBundleVersion or App Store
          # Connect rejects the upload with error 90379, after the build.
          APP_V=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")
          WATCH_APP=$(find "$APP/Watch" -maxdepth 1 -name '*.app' | head -1)
          WATCH_V=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$WATCH_APP/Info.plist")
          echo "iOS CFBundleVersion:   $APP_V"
          echo "watch CFBundleVersion: $WATCH_V"
          if [ "$APP_V" != "$WATCH_V" ]; then
            echo "FAIL: CFBundleVersion mismatch — Apple would reject this with 90379"
            exit 1
          fi
          echo "OK: build numbers match"

          # The watch app needs its own icon, and this is checked SERVER-SIDE at
          # upload: without it the build succeeds, the .ipa is valid, and App
          # Store Connect rejects with "No icons found for watch application"
          # after you have already spent the whole build. Catch it here instead.
          if ! /usr/libexec/PlistBuddy -c 'Print :CFBundleIconName' "$WATCH_APP/Info.plist" >/dev/null 2>&1; then
            echo "FAIL: the watch app has no CFBundleIconName — App Store Connect will refuse the upload"
            echo "Set \`icon\` in expo/targets/watch/expo-target.config.js"
            exit 1
          fi
          echo "OK: watch icon declared ($(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconName' "$WATCH_APP/Info.plist"))"

          # The quietest failure of the lot, and the one that actually shipped:
          # a watch app whose MinimumOSVersion is above the tester's watchOS
          # builds, uploads, and passes every check above. TestFlight even
          # reports "Apple Watch: Yes" on the App Details page. But the iPhone's
          # Watch app never lists it under Available Apps, because watchOS
          # filters out anything the device cannot run — silently, with no error
          # to find anywhere. Build 16 shipped with an 11.0 floor and could not
          # be installed on the only watch available to test it.
          #
          # WATCH_MIN_OS is the floor this project intends to support. Raising
          # it is a real decision — it drops hardware — so it belongs in the
          # diff, not in a config file nobody re-reads. Keep it in step with
          # `deploymentTarget` in expo/targets/watch/expo-target.config.js.
          WATCH_MIN_OS=10.0
          ACTUAL_MIN=$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$WATCH_APP/Info.plist" 2>/dev/null || echo "")
          echo "watch MinimumOSVersion: ${ACTUAL_MIN:-(absent)}"
          if [ "$ACTUAL_MIN" != "$WATCH_MIN_OS" ]; then
            echo "FAIL: the watch app requires watchOS '${ACTUAL_MIN:-?}', but this project targets $WATCH_MIN_OS."
            echo "Watches below that floor are never offered the app, with no error shown to the user."
            echo "Fix \`deploymentTarget\` in expo/targets/watch/expo-target.config.js, or update WATCH_MIN_OS here."
            exit 1
          fi
          echo "OK: watch runs on watchOS $WATCH_MIN_OS and later"

      - name: Keep the .ipa
        uses: actions/upload-artifact@v4
        with:
          name: tee-ios-ipa
          path: ${{ runner.temp }}/out/tee.ipa
          if-no-files-found: error
          # Public repo: anyone with the run URL can download this. It holds no
          # private key, and its only job is recovering a failed upload.
          retention-days: 1

      - name: Upload to App Store Connect
        if: ${{ inputs.submit }}
        working-directory: expo
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          # eas submit does not consume build quota — it only uploads a binary.
          npx --yes eas-cli@latest submit \
            --platform ios \
            --profile "${{ inputs.profile }}" \
            --path "$RUNNER_TEMP/out/tee.ipa" \
            --non-interactive
