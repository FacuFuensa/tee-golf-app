name: iOS release (build, sign, upload)

# Signed iOS release build on a GitHub-hosted macOS runner, replacing EAS Build.
#
# Why this exists: the EAS free plan caps iOS builds per month, and this repo is
# public — which makes GitHub's macOS runners free and unmetered. Everything EAS
# was doing (prebuild, pod install, archive, sign, export, upload to App Store
# Connect) happens here instead. See .superpowers/sdd/gha-release-report.md for
# the research behind each decision, including why provisioning profiles are NOT
# secrets and why the distribution certificate must be the *existing* one.
#
# TRIGGER POLICY: workflow_dispatch only. This talks to Apple's servers — it can
# create provisioning profiles and (when asked) push a build to TestFlight. It
# must never fire on a push. The `distribute` input defaults to `artifact-only`
# so a first run is a genuine dry run.
#
# SECRET HYGIENE (this repo is PUBLIC — read before editing):
#   - No step below uses `set -x`. Tracing a step that touches a secret would
#     print the secret into a world-readable log. `set -euo pipefail` only.
#   - Secrets are passed through `env:` and referenced as "$VAR", never
#     interpolated as ${{ secrets.X }} inside a run block — the runner echoes
#     the *source* of a run block, so ${{ }} would print the literal value.
#   - The signing keychain and the decoded .p12 / .p8 are deleted in a step
#     guarded by always(), so a failed or cancelled run leaves nothing behind.

on:
  workflow_dispatch:
    inputs:
      distribute:
        description: "What to do with the signed .ipa once it exists"
        type: choice
        required: true
        default: artifact-only
        options:
          # Build and sign only. The .ipa is uploaded as a workflow artifact and
          # nothing is sent to Apple. This is the dry run.
          - artifact-only
          # Additionally run `altool --validate-app`, which preflights the .ipa
          # against App Store Connect (catches CFBundleVersion mismatches,
          # missing icons, bad entitlements) WITHOUT consuming a build number.
          - validate
          # Additionally upload to App Store Connect / TestFlight. Irreversible:
          # a build number, once uploaded, can never be reused.
          - upload
      build_number:
        description: "CFBundleVersion to stamp on BOTH the app and the watch app. Leave blank to use the workflow run number."
        type: string
        required: false
        default: ""

# Two concurrent runs would race for the same build number. Queue instead.
concurrency:
  group: ios-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: expo/package-lock.json

      # Fail before doing any work — and before touching Apple — if the
      # developer hasn't created the secrets yet. Only emptiness is tested;
      # nothing is printed.
      - name: Check required secrets are present
        env:
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "${IOS_DIST_CERT_P12_BASE64:-}" ] || missing="$missing IOS_DIST_CERT_P12_BASE64"
          [ -n "${IOS_DIST_CERT_PASSWORD:-}" ]  || missing="$missing IOS_DIST_CERT_PASSWORD"
          [ -n "${ASC_API_KEY_P8_BASE64:-}" ]   || missing="$missing ASC_API_KEY_P8_BASE64"
          [ -n "${ASC_API_KEY_ID:-}" ]          || missing="$missing ASC_API_KEY_ID"
          [ -n "${ASC_API_ISSUER_ID:-}" ]       || missing="$missing ASC_API_ISSUER_ID"
          if [ -n "$missing" ]; then
            echo "Missing repository secrets:$missing"
            echo "See .superpowers/sdd/gha-release-report.md for how to obtain each one."
            exit 1
          fi
          echo "All required secrets are set."

      # --- Version metadata ---------------------------------------------------
      #
      # Nothing here is hardcoded: the team id, bundle id and marketing version
      # come out of expo/app.json, and the App Store Connect app id comes out of
      # expo/eas.json. Neither file is modified by this workflow, so there is no
      # second source of truth to drift.
      #
      # BUILD NUMBER: App Store Connect rejects an upload with error 90379 when
      # the embedded watch app's CFBundleVersion doesn't equal the iOS app's.
      # EAS solved this with appVersionSource: "remote" + autoIncrement, which
      # does not exist here. The replacement is github.run_number: monotonic,
      # never reused (it does not reset when the workflow file changes), and
      # already unique per run. It is applied to both targets — see the two
      # steps flagged "BUILD NUMBER SYNC" below.
      - name: Resolve version metadata
        working-directory: expo
        env:
          INPUT_BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -euo pipefail

          BUILD_NUMBER="${INPUT_BUILD_NUMBER:-}"
          if [ -z "$BUILD_NUMBER" ]; then
            BUILD_NUMBER="$GITHUB_RUN_NUMBER"
          fi
          # CFBundleVersion must be one to three period-separated integers.
          if ! printf '%s' "$BUILD_NUMBER" | grep -Eq '^[0-9]+(\.[0-9]+){0,2}$'; then
            echo "Invalid build number '$BUILD_NUMBER' — must be 1-3 dot-separated integers."
            exit 1
          fi

          MARKETING_VERSION=$(node -p "require('./app.json').expo.version")
          TEAM_ID=$(node -p "require('./app.json').expo.ios.appleTeamId")
          BUNDLE_ID=$(node -p "require('./app.json').expo.ios.bundleIdentifier")
          ASC_APP_ID=$(node -p "require('./eas.json').submit.production.ios.ascAppId")

          {
            echo "BUILD_NUMBER=$BUILD_NUMBER"
            echo "MARKETING_VERSION=$MARKETING_VERSION"
            echo "TEAM_ID=$TEAM_ID"
            echo "BUNDLE_ID=$BUNDLE_ID"
            echo "ASC_APP_ID=$ASC_APP_ID"
          } >> "$GITHUB_ENV"

          echo "version $MARKETING_VERSION ($BUILD_NUMBER) — team $TEAM_ID — $BUNDLE_ID — ASC app $ASC_APP_ID"

      - name: Install JS dependencies
        working-directory: expo
        run: npm ci

      # BUILD NUMBER SYNC (1 of 3): the watch target.
      #
      # expo/targets/watch/expo-target.config.js already reads
      # EAS_BUILD_IOS_BUILD_NUMBER and feeds it into config.ios.buildNumber,
      # which is what @bacons/apple-targets turns into the watch target's
      # CURRENT_PROJECT_VERSION build setting (with-widget.js). Setting that env
      # var here reuses the hook that already exists rather than forking the
      # config for CI — the EAS path keeps working untouched. As a side effect
      # the same mutated value also reaches the main app's CFBundleVersion via
      # Expo's own withBuildNumber mod, which is exactly what we want.
      - name: Prebuild the iOS project
        working-directory: expo
        env:
          EAS_BUILD_IOS_BUILD_NUMBER: ${{ env.BUILD_NUMBER }}
        run: npx expo prebuild -p ios --no-install

      - name: Install CocoaPods dependencies
        working-directory: expo/ios
        run: pod install

      # BUILD NUMBER SYNC (2 of 3): the main app, belt-and-braces.
      #
      # Expo writes the main app's CFBundleVersion into Info.plist as a LITERAL
      # string (see @expo/config-plugins ios/Version.js: setBuildNumber writes
      # config.ios.buildNumber straight into the plist), NOT as
      # $(CURRENT_PROJECT_VERSION). So a command-line build setting cannot reach
      # it — it has to be written into the file. Doing it explicitly here means
      # the main app is correct even if the env-var propagation above ever
      # changes upstream.
      - name: Stamp the main app's build number
        working-directory: expo/ios
        run: |
          set -euo pipefail
          INFO_PLIST=$(find . -maxdepth 2 -name Info.plist -not -path "./Pods/*" | head -1)
          if [ -z "$INFO_PLIST" ]; then
            echo "Could not locate the main app's Info.plist under expo/ios."
            exit 1
          fi
          echo "Main app Info.plist: $INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $MARKETING_VERSION" "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$INFO_PLIST"

      # --- Signing material ---------------------------------------------------
      #
      # The ONLY credential that has to travel as a secret is the distribution
      # certificate's private key (a .p12). Apple never lets a private key be
      # re-downloaded, and -allowProvisioningUpdates cannot conjure one, so it
      # has to come from the developer's existing EAS-managed certificate.
      #
      # Provisioning profiles are deliberately NOT secrets: xcodebuild creates
      # and downloads them itself at archive and export time, for BOTH
      # com.teegolf.app and com.teegolf.app.watchkitapp, because both targets
      # use CODE_SIGN_STYLE = Automatic and we pass -allowProvisioningUpdates
      # with an App Store Connect API key.
      #
      # The keychain password is generated here and never leaves the runner —
      # it is not a repository secret because it protects nothing that outlives
      # the job. `security delete-keychain` does not need it.
      - name: Import the signing certificate into a temporary keychain
        env:
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          set -euo pipefail

          CERT_PATH="$RUNNER_TEMP/dist-cert.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/tee-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          echo "::add-mask::$KEYCHAIN_PASSWORD"

          printf '%s' "$IOS_DIST_CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # Six-hour lock timeout; the job is capped at 90 minutes, so the
          # keychain stays unlocked for every later step without ever needing
          # the password again.
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$IOS_DIST_CERT_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          # Without a partition list, codesign triggers a UI authorisation
          # prompt that can never be answered on a headless runner and the
          # build hangs until the job times out.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          # Prepend rather than replace, so the runner's own login keychain is
          # still searchable by anything else that needs it.
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN_PATH"

          rm -f "$CERT_PATH"

          # Names only. `find-identity` prints the certificate's common name and
          # SHA-1 fingerprint — both public information, present in every
          # App Store binary — and never the private key.
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Write the App Store Connect API key
        env:
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
        run: |
          set -euo pipefail
          # altool looks for AuthKey_<keyid>.p8 inside $API_PRIVATE_KEYS_DIR;
          # xcodebuild wants an explicit path. One file satisfies both.
          KEYS_DIR="$RUNNER_TEMP/private_keys"
          mkdir -p "$KEYS_DIR"
          chmod 700 "$KEYS_DIR"
          KEY_PATH="$KEYS_DIR/AuthKey_${ASC_API_KEY_ID}.p8"
          printf '%s' "$ASC_API_KEY_P8_BASE64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          {
            echo "API_PRIVATE_KEYS_DIR=$KEYS_DIR"
            echo "ASC_KEY_PATH=$KEY_PATH"
          } >> "$GITHUB_ENV"

      # --- Archive ------------------------------------------------------------
      #
      # BUILD NUMBER SYNC (3 of 3): CURRENT_PROJECT_VERSION on the command line.
      #
      # The watch app is built with GENERATE_INFOPLIST_FILE = YES (see
      # @bacons/apple-targets configuration-list.js createWatchAppConfigurationList),
      # so its CFBundleVersion comes from the CURRENT_PROJECT_VERSION build
      # setting rather than from a file. A command-line build setting overrides
      # every target in the workspace, which is precisely the guarantee needed:
      # there is no per-target value left that could disagree. The main app is
      # unaffected because its Info.plist holds a literal (stamped above).
      # MARKETING_VERSION is pinned the same way — Apple also requires the watch
      # app's CFBundleShortVersionString to match the iOS app's.
      #
      # -allowProvisioningUpdates + the three -authenticationKey* flags let
      # xcodebuild create/download the App Store provisioning profiles for both
      # bundle identifiers on the fly. The private key it signs with is the one
      # imported above; the profiles it needs are fetched, not stored.
      - name: Archive
        working-directory: expo/ios
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          set -euo pipefail

          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          SCHEME="${WORKSPACE%.xcworkspace}"
          echo "Workspace: $WORKSPACE — scheme: $SCHEME"

          if ! xcodebuild -list -json -workspace "$WORKSPACE" \
            | node -e 'const d=JSON.parse(require("fs").readFileSync(0,"utf8"));process.exit(((d.workspace&&d.workspace.schemes)||[]).includes(process.argv[1])?0:1)' "$SCHEME"; then
            echo "Scheme '$SCHEME' not found in $WORKSPACE."
            xcodebuild -list -workspace "$WORKSPACE"
            exit 1
          fi

          echo "ARCHIVE_PATH=$RUNNER_TEMP/Tee.xcarchive" >> "$GITHUB_ENV"

          xcodebuild archive \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Tee.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_API_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_API_ISSUER_ID" \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            MARKETING_VERSION="$MARKETING_VERSION"

      # --- Export -------------------------------------------------------------
      #
      # signingStyle = automatic means the plist needs NO `provisioningProfiles`
      # dictionary at all — so the watch app does not need its own entry, and no
      # profile ever has to be stored as a secret. (With manual signing it would
      # need one entry per executable, keyed by bundle id, watch app included.)
      #
      # `app-store-connect` is the current spelling; `app-store` has been
      # deprecated since Xcode 15.3 and only survives as an alias.
      #
      # manageAppVersionAndBuildNumber defaults to YES, which lets Xcode silently
      # rewrite CFBundleVersion during export. That would undo all three build
      # number sync steps above and is exactly how a 90379 mismatch sneaks back
      # in. It is turned off deliberately.
      - name: Write ExportOptions.plist
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>export</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
            <key>stripSwiftSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST
          plutil -lint "$RUNNER_TEMP/ExportOptions.plist"
          cat "$RUNNER_TEMP/ExportOptions.plist"

      - name: Export signed .ipa
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_API_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_API_ISSUER_ID"

          IPA=$(ls "$RUNNER_TEMP/export"/*.ipa | head -1)
          echo "IPA_PATH=$IPA" >> "$GITHUB_ENV"
          ls -lh "$RUNNER_TEMP/export"

      # The contract test for error 90379. App Store Connect rejects an upload
      # whose embedded watch app disagrees with the host app on either version
      # string, and a missing watch app is accepted silently — it just never
      # shows up in TestFlight. Both are checked here, on the real .ipa, before
      # anything is sent to Apple.
      - name: Verify the watch app is embedded and versions match
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/ipa-check"
          rm -rf "$WORK"
          mkdir -p "$WORK"
          unzip -q "$IPA_PATH" -d "$WORK"

          APP=$(ls -d "$WORK"/Payload/*.app | head -1)
          echo "App bundle: $(basename "$APP")"

          WATCH_APP=$(ls -d "$APP"/Watch/*.app 2>/dev/null | head -1 || true)
          if [ -z "$WATCH_APP" ]; then
            echo "FAIL: no watch app inside $(basename "$APP")/Watch."
            echo "App Store Connect would accept this .ipa and the watch app would simply never appear."
            exit 1
          fi
          echo "Watch bundle: $(basename "$WATCH_APP")"

          read_key() { /usr/libexec/PlistBuddy -c "Print :$2" "$1/Info.plist"; }

          APP_BUILD=$(read_key "$APP" CFBundleVersion)
          APP_SHORT=$(read_key "$APP" CFBundleShortVersionString)
          WATCH_BUILD=$(read_key "$WATCH_APP" CFBundleVersion)
          WATCH_SHORT=$(read_key "$WATCH_APP" CFBundleShortVersionString)
          WATCH_ID=$(read_key "$WATCH_APP" CFBundleIdentifier)

          echo "app   $APP_SHORT ($APP_BUILD)"
          echo "watch $WATCH_SHORT ($WATCH_BUILD)  $WATCH_ID"

          fail=0
          [ "$APP_BUILD" = "$BUILD_NUMBER" ] || { echo "FAIL: app CFBundleVersion is '$APP_BUILD', expected '$BUILD_NUMBER'."; fail=1; }
          [ "$WATCH_BUILD" = "$BUILD_NUMBER" ] || { echo "FAIL: watch CFBundleVersion is '$WATCH_BUILD', expected '$BUILD_NUMBER'."; fail=1; }
          [ "$APP_SHORT" = "$MARKETING_VERSION" ] || { echo "FAIL: app CFBundleShortVersionString is '$APP_SHORT', expected '$MARKETING_VERSION'."; fail=1; }
          [ "$WATCH_SHORT" = "$MARKETING_VERSION" ] || { echo "FAIL: watch CFBundleShortVersionString is '$WATCH_SHORT', expected '$MARKETING_VERSION'."; fail=1; }
          [ "$WATCH_ID" = "${BUNDLE_ID}.watchkitapp" ] || { echo "FAIL: watch bundle id is '$WATCH_ID', expected '${BUNDLE_ID}.watchkitapp'."; fail=1; }
          if [ "$fail" != "0" ]; then
            echo "Refusing to continue — this would be rejected as error 90379."
            exit 1
          fi
          echo "OK: watch app embedded, versions and bundle id all match."

      # Uploaded before any Apple-facing distribution step, so a failed upload
      # still leaves a downloadable, already-signed build.
      #
      # Note: on a public repository, workflow artifacts are downloadable by
      # anyone with the run URL. An .ipa contains only public material (the
      # embedded profile carries the certificate, not its private key), but keep
      # retention short regardless.
      - name: Upload the .ipa as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: tee-ios-${{ env.MARKETING_VERSION }}-${{ env.BUILD_NUMBER }}
          path: ${{ env.IPA_PATH }}
          if-no-files-found: error
          retention-days: 7

      - name: Validate against App Store Connect
        if: ${{ inputs.distribute == 'validate' }}
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          # --validate-app preflights the package server-side without consuming
          # the build number, so the same number can still be uploaded later.
          xcrun altool --validate-app \
            -f "$IPA_PATH" \
            -t ios \
            --apiKey "$ASC_API_KEY_ID" \
            --apiIssuer "$ASC_API_ISSUER_ID"

      - name: Upload to App Store Connect
        if: ${{ inputs.distribute == 'upload' }}
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_PUBLIC_ID: ${{ secrets.ASC_PUBLIC_ID }}
        run: |
          set -euo pipefail
          # --upload-package, not --upload-app: altool(7) marks --upload-app
          # "[DEPRECATED use --upload-package instead]". notarytool replaced
          # altool for *notarisation* only — App Store upload is still altool.
          args=(
            --upload-package "$IPA_PATH"
            --type ios
            --apple-id "$ASC_APP_ID"
            --bundle-id "$BUNDLE_ID"
            --bundle-version "$BUILD_NUMBER"
            --bundle-short-version-string "$MARKETING_VERSION"
            --apiKey "$ASC_API_KEY_ID"
            --apiIssuer "$ASC_API_ISSUER_ID"
          )
          # Only needed when the Apple ID belongs to several providers. Optional
          # secret; find the value with `xcrun altool --list-providers`.
          if [ -n "${ASC_PUBLIC_ID:-}" ]; then
            args+=(--asc-public-id "$ASC_PUBLIC_ID")
          fi
          xcrun altool "${args[@]}"

      # always(): a failed, cancelled or timed-out run must not leave the
      # distribution private key sitting in a keychain, or the API key on disk.
      # GitHub-hosted runners are ephemeral, but this workflow must stay correct
      # if it is ever pointed at a self-hosted one.
      - name: Destroy the signing keychain and API key
        if: ${{ always() }}
        run: |
          set -euo pipefail
          security delete-keychain "$RUNNER_TEMP/tee-signing.keychain-db" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/private_keys" "$RUNNER_TEMP/dist-cert.p12"
          echo "Signing material removed."
